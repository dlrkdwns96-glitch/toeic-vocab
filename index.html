<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="토익 단어">
<meta name="theme-color" content="#0a0a0f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>토익 단어 암기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0f;--bg2:#13131a;--bg3:#1c1c26;
  --border:rgba(255,255,255,0.08);
  --text:#f0f0f5;--muted:#7a7a90;--hint:#45455a;
  --green:#1D9E75;--green-light:#5DCAA5;--green-dim:rgba(29,158,117,0.15);
  --coral:#D85A30;--coral-dim:rgba(216,90,48,0.15);
  --radius:16px;
  --safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;overflow:hidden;}

/* ── PROFILE SCREEN ── */
#profile-screen{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;padding:var(--safe-top) 24px var(--safe-bot);
}
.profile-title{font-family:'Space Mono',monospace;font-size:13px;color:var(--green-light);letter-spacing:.08em;margin-bottom:40px;}
.profile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;width:100%;max-width:340px;margin-bottom:32px;}
.profile-card{display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;padding:8px;border-radius:12px;transition:background .15s;}
.profile-card:active{background:var(--bg3);}
.profile-avatar{width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;border:2px solid transparent;transition:border-color .2s;font-family:'Space Mono',monospace;}
.profile-card:hover .profile-avatar{border-color:var(--green);}
.profile-name{font-size:12px;color:var(--muted);text-align:center;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.add-profile-card .profile-avatar{background:var(--bg3);border:1.5px dashed var(--border);color:var(--hint);font-size:28px;}
.add-profile-card .profile-name{color:var(--hint);}

/* ── ADD PROFILE MODAL ── */
#modal-bg{
  display:none;position:absolute;inset:0;background:rgba(0,0,0,0.7);
  align-items:center;justify-content:center;z-index:100;padding:24px;
}
#modal-bg.show{display:flex;}
.modal{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;max-width:320px;}
.modal h3{font-size:15px;font-weight:500;margin-bottom:20px;text-align:center;}
.avatar-picker{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:20px;}
.av-opt{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;border:2px solid transparent;font-family:'Space Mono',monospace;font-weight:700;}
.av-opt.picked{border-color:var(--green);}
.modal input{width:100%;background:var(--bg3);border:0.5px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;padding:10px 14px;font-family:'Noto Sans KR',sans-serif;outline:none;margin-bottom:16px;}
.modal input:focus{border-color:var(--green);}
.modal-btns{display:flex;gap:8px;}
.modal-btns button{flex:1;padding:11px;border-radius:10px;font-size:13px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
.btn-confirm{border:0.5px solid var(--green);background:var(--green-dim);color:var(--green-light);}
.btn-cancel{border:0.5px solid var(--border);background:var(--bg3);color:var(--muted);}

/* ── MAIN APP ── */
#app-screen{display:none;flex-direction:column;height:100%;padding-top:var(--safe-top);padding-bottom:var(--safe-bot);}
#app-screen.show{display:flex;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 10px;flex-shrink:0;}
.topbar-left{display:flex;align-items:center;gap:8px;}
.topbar-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:'Space Mono',monospace;cursor:pointer;border:1.5px solid var(--border);}
.topbar-name{font-size:12px;color:var(--muted);}
.word-count{font-size:12px;color:var(--muted);background:var(--bg3);padding:4px 10px;border-radius:99px;border:0.5px solid var(--border);}
.tabs{display:flex;gap:6px;padding:0 16px 12px;flex-shrink:0;}
.tab{flex:1;padding:9px 4px;border-radius:10px;border:0.5px solid var(--border);background:var(--bg2);color:var(--muted);font-size:12px;font-family:'Noto Sans KR',sans-serif;cursor:pointer;text-align:center;transition:all .2s;}
.tab.on{background:var(--green-dim);border-color:var(--green);color:var(--green-light);}
.scroll{flex:1;overflow-y:auto;padding:0 16px;-webkit-overflow-scrolling:touch;}
.scroll::-webkit-scrollbar{display:none;}

/* ── CONTENT STYLES ── */
.prog-wrap{margin-bottom:14px;}
.prog-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:6px;}
.prog-track{height:3px;background:var(--bg3);border-radius:99px;}
.prog-fill{height:3px;background:var(--green);border-radius:99px;transition:width .4s cubic-bezier(.4,0,.2,1);}
.wcard{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);padding:24px 20px 20px;margin-bottom:12px;text-align:center;}
.wcard .badge{display:inline-block;font-size:10px;padding:3px 10px;border-radius:99px;background:var(--bg3);color:var(--muted);border:0.5px solid var(--border);margin-bottom:14px;font-family:'Space Mono',monospace;letter-spacing:.04em;}
.wcard .eng{font-family:'Space Mono',monospace;font-size:28px;font-weight:700;color:var(--text);margin-bottom:8px;line-height:1.2;}
.wcard .kor{font-size:15px;font-weight:500;color:var(--green-light);margin-bottom:8px;line-height:1.5;}
.wcard .desc{font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:12px;}
.wcard .ex{background:var(--bg3);border-radius:10px;padding:11px 13px;font-size:12px;color:var(--muted);line-height:1.7;text-align:left;border:0.5px solid var(--border);}
.wcard .ex em{color:var(--green-light);font-style:italic;}
.ans-wrap{margin-bottom:10px;}
.ans-hint{font-size:12px;color:var(--muted);margin-bottom:8px;text-align:center;}
.ans-row{display:flex;gap:8px;}
.ans-row input{flex:1;background:var(--bg2);border:0.5px solid var(--border);border-radius:10px;color:var(--text);font-size:15px;padding:12px 14px;font-family:'Noto Sans KR',sans-serif;outline:none;transition:border-color .2s;}
.ans-row input:focus{border-color:var(--green);}
.ans-row button{padding:12px 16px;border-radius:10px;border:0.5px solid var(--green);background:var(--green-dim);color:var(--green-light);font-size:13px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
.feedback{text-align:center;font-size:13px;font-weight:700;padding:8px 0;min-height:32px;letter-spacing:.02em;}
.feedback.ok{color:var(--green-light);}
.feedback.no{color:var(--coral);}
.btn-g{width:100%;padding:14px;border-radius:12px;border:0.5px solid var(--green);background:var(--green-dim);color:var(--green-light);font-size:14px;font-weight:500;cursor:pointer;font-family:'Noto Sans KR',sans-serif;margin-bottom:8px;transition:all .15s;}
.btn-g:active{transform:scale(.98);}
.btn-d{width:100%;padding:14px;border-radius:12px;border:0.5px solid var(--border);background:var(--bg2);color:var(--muted);font-size:13px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;margin-bottom:8px;}
.score-big{font-family:'Space Mono',monospace;font-size:52px;font-weight:700;color:var(--green);text-align:center;padding:20px 0 4px;}
.score-sub{text-align:center;font-size:13px;color:var(--muted);margin-bottom:24px;}
.section-label{font-size:10px;font-family:'Space Mono',monospace;letter-spacing:.08em;color:var(--hint);text-transform:uppercase;margin:14px 0 8px;}
.upload-zone{border:1.5px dashed var(--border);border-radius:var(--radius);padding:24px 16px;text-align:center;cursor:pointer;margin-bottom:4px;}
.upload-zone:active{background:var(--bg3);}
.upload-zone input{display:none;}
.upload-zone p{font-size:13px;color:var(--muted);line-height:1.6;}
.upload-zone p b{color:var(--green-light);}
.add-row{display:flex;gap:6px;margin-bottom:4px;}
.add-row input{flex:1;background:var(--bg2);border:0.5px solid var(--border);border-radius:10px;color:var(--text);font-size:13px;padding:10px 12px;font-family:'Noto Sans KR',sans-serif;outline:none;min-width:0;}
.add-row input:focus{border-color:var(--green);}
.add-row button{padding:10px 14px;border-radius:10px;border:0.5px solid var(--green);background:var(--green-dim);color:var(--green-light);font-size:12px;cursor:pointer;white-space:nowrap;font-family:'Noto Sans KR',sans-serif;}
.wl-list{border:0.5px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:8px;}
.wl-item{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:0.5px solid var(--border);font-size:13px;cursor:pointer;}
.wl-item:last-child{border-bottom:none;}
.wl-en{font-family:'Space Mono',monospace;font-size:12px;color:var(--text);min-width:100px;}
.wl-kr{flex:1;color:var(--muted);font-size:12px;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px;}
.stat-box{background:var(--bg2);border:0.5px solid var(--border);border-radius:12px;padding:14px 12px;text-align:center;}
.stat-n{font-family:'Space Mono',monospace;font-size:22px;font-weight:700;color:var(--text);}
.stat-l{font-size:11px;color:var(--muted);margin-top:3px;}
.install-banner{margin:0 0 12px;background:var(--bg2);border:0.5px solid var(--green);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;}
.install-banner p{font-size:12px;color:var(--muted);line-height:1.5;flex:1;}
.install-banner p b{color:var(--green-light);}
.install-close{color:var(--hint);font-size:18px;cursor:pointer;line-height:1;}
.scanning-box{text-align:center;padding:36px 16px;}
.dot-row{display:flex;justify-content:center;gap:6px;margin-bottom:14px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse .9s infinite;}
.dot:nth-child(2){animation-delay:.2s;}.dot:nth-child(3){animation-delay:.4s;}
@keyframes pulse{0%,80%,100%{opacity:.3;transform:scale(.7)}40%{opacity:1;transform:scale(1)}}
.scan-sub{font-size:13px;color:var(--muted);}
.preview-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:0.5px solid var(--border);font-size:13px;}
.preview-item:last-child{border-bottom:none;}
.preview-en{font-family:'Space Mono',monospace;font-size:12px;color:var(--green-light);min-width:110px;}
.preview-kr{flex:1;color:var(--muted);font-size:12px;}
.week-tab{flex-shrink:0;padding:5px 14px;border-radius:99px;border:0.5px solid var(--border);background:var(--bg2);color:var(--muted);font-size:12px;cursor:pointer;white-space:nowrap;font-family:'Noto Sans KR',sans-serif;}
.week-tab.on{background:var(--green-dim);border-color:var(--green);color:var(--green-light);}
.week-tab-add{flex-shrink:0;padding:5px 12px;border-radius:99px;border:1.5px dashed var(--border);background:transparent;color:var(--hint);font-size:12px;cursor:pointer;white-space:nowrap;}
.fade-in{animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.chunk-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.chunk-btn{background:var(--bg2);border:0.5px solid var(--border);border-radius:12px;padding:14px 12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px;transition:background .15s;}
.chunk-btn:active{background:var(--bg3);}
.chunk-btn.chunk-current{border-color:var(--green);background:var(--green-dim);}
.chunk-btn.chunk-done{border-color:var(--hint);opacity:.6;}
.chunk-range{font-family:'Space Mono',monospace;font-size:14px;font-weight:700;color:var(--text);}
.chunk-btn.chunk-current .chunk-range{color:var(--green-light);}
.chunk-label{font-size:11px;color:var(--muted);}
.chunk-btn.chunk-current .chunk-label{color:var(--green);}
</style>
</head>
<body>

<!-- PROFILE SCREEN -->
<div id="profile-screen">
  <div class="profile-title">TOEIC VOCAB</div>
  <div class="profile-grid" id="profile-grid"></div>
</div>

<!-- ADD PROFILE MODAL -->
<div id="modal-bg">
  <div class="modal">
    <h3>프로필 추가</h3>
    <div class="avatar-picker" id="avatar-picker"></div>
    <input type="text" id="profile-name-input" placeholder="이름을 입력하세요" maxlength="8">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn-confirm" onclick="confirmAddProfile()">추가</button>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app-screen">
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-avatar" id="topbar-avatar" onclick="goProfileScreen()"></div>
      <span class="topbar-name" id="topbar-name"></span>
    </div>
    <span class="word-count" id="wcount">0단어</span>
  </div>
  <div style="display:flex;align-items:center;gap:8px;padding:0 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;" id="week-tabs"></div>
  <div class="tabs">
    <button class="tab on" id="t-learn" onclick="goTab('learn')">학습</button>
    <button class="tab" id="t-test" onclick="goTab('test')">테스트</button>
    <button class="tab" id="t-manage" onclick="goTab('manage')">단어 관리</button>
  </div>
  <div class="scroll" id="area"></div>
<input id="ghost-focus" style="position:absolute;opacity:0;width:0;height:0;pointer-events:none;" onkeydown="handleGhostKey(event)" readonly>
</div>

// ── LEARN ──
function chunkWords(){
  return profileWords().slice(chunkStart, chunkStart+CHUNK);
}
function chunkLabel(){
  const end=Math.min(chunkStart+CHUNK, words.length);
  return (chunkStart+1)+'~'+end;
}

function renderLearn(a){
  words=profileWords();
  wordWriteCount=0;meanWriteCount=0;learnWrong=false;
  if(!words.length){a.innerHTML='<p style="text-align:center;color:var(--muted);font-size:13px;padding:40px 0;">단어가 없습니다.</p>';return;}
  const chunk=chunkWords();

  if(idx>=chunk.length){
    learnedWords=[...chunk];
    const totalWords=words.length;
    const hasNext=chunkStart+CHUNK<totalWords;
    const nextCount=Math.min(CHUNK, totalWords-(chunkStart+CHUNK));
    a.innerHTML=`<div class="fade-in" style="padding-top:20px;">
      <div class="score-big">${chunk.length}</div>
      <div class="score-sub">${chunkLabel()} 학습 완료!</div>
      <button class="btn-g" id="btn-start-test">테스트 시작 →</button>
      ${hasNext?`<button class="btn-d" id="btn-next-chunk">다음 ${nextCount}단어 학습하기</button>`:''}
      <button class="btn-d" id="btn-restart-chunk">이 구간 다시 학습</button>
      <button class="btn-d" id="btn-chunk-select">구간 선택으로 돌아가기</button>

    const btnNext=document.getElementById('btn-next-chunk');
    if(btnNext)btnNext.addEventListener('click',()=>{chunkStart+=CHUNK;idx=0;answered=false;testFromLearn=false;words=profileWords();renderLearn(document.getElementById('area'));});
    document.getElementById('btn-restart-chunk').addEventListener('click',()=>{idx=0;answered=false;renderLearn(document.getElementById('area'));});
    document.getElementById('btn-chunk-select').addEventListener('click',()=>{showChunkSelect();});
    return;
  }
  const w=chunk[idx];
  const pct=Math.round(idx/chunk.length*100);
  const chunkEnd=Math.min(chunkStart+CHUNK,words.length);
  a.innerHTML=`<div class="fade-in" style="display:flex;flex-direction:column;min-height:calc(100vh - 140px);">
    <div class="prog-wrap">
      <div class="prog-meta">
        <span>${chunkLabel()} · ${idx+1}/${chunk.length}</span>
        <span>${pct}%</span>
      </div>
      <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="wcard">
      <div class="badge">학습 모드</div>
      <div class="eng">${w.w}</div>
      <div class="kor">${w.m}</div>
      ${w.d?`<div class="desc">${w.d}</div>`:''}
      ${w.ex?`<div class="ex" style="margin-top:10px;">${w.ex}</div>`:''}
    </div>
    <div style="flex:0.5;"></div>
    <div class="ans-wrap" style="padding-bottom:calc(var(--safe-bot) + 8px);">
      <div id="write-counter" style="display:none;text-align:center;font-size:11px;color:var(--muted);margin-bottom:6px;">
        단어 <span id="wc" style="color:var(--green-light);font-weight:700;">0</span>/3
        &nbsp;·&nbsp;
        뜻 <span id="mc" style="color:var(--green-light);font-weight:700;">0</span>/3
      </div>
      <div class="feedback" id="fb" style="margin-bottom:6px;"></div>
      <div class="ans-row">
        <input type="text" id="ans" placeholder="단어 또는 뜻을 입력하세요" autocomplete="off" autocorrect="off" spellcheck="false" onkeydown="handleLearnKey(event)">

function handleGhostKey(e){
  if(e.key!=='Enter')return;
  e.preventDefault();
  if(!answered)return;
  if(tab==='learn'){idx++;answered=false;wordWriteCount=0;meanWriteCount=0;learnWrong=false;render();}
  else if(tab==='test'){idx++;answered=false;renderTest(document.getElementById('area'));}
}
function handleLearnKey(e){
  if(e.key!=='Enter')return;
  e.preventDefault();
  if(answered){
    idx++;answered=false;wordWriteCount=0;meanWriteCount=0;learnWrong=false;
    render();
  } else {
    checkLearn();
    setTimeout(()=>{const el=document.getElementById('ans');if(el)el.focus();},50);
  }
}
function handleTestKey(e){
  if(e.key!=='Enter')return;
  e.preventDefault();

    idx++;answered=false;
    renderTest(document.getElementById('area'));
  } else {
    checkAns();
    setTimeout(()=>{const el=document.getElementById('ans');if(el)el.focus();},50);
  }
}
function updateWriteGuide(){
  const wc=document.getElementById('wc');
  const mc=document.getElementById('mc');
  if(wc)wc.textContent=wordWriteCount;
  if(mc)mc.textContent=meanWriteCount;
}
let learnWrong=false; // 이번 단어에서 틀린 적 있는지

function checkLearn(){
  if(answered)return;
  const inp=document.getElementById('ans');
  if(!inp||!inp.value.trim())return;
  const chunk=chunkWords();
  const w=chunk[idx];
  const val=inp.value.trim().toLowerCase();
  const wordKeys=w.w.toLowerCase().replace(/[~·\/\(\)\[\]]/g,' ').split(/[\s,;]+/).filter(k=>k.length>1);
  const meanKeys=w.m.replace(/[~·\/\(\)\[\]]/g,' ').split(/[\s,;]+/).filter(k=>k.length>1);
  const isWord=wordKeys.some(k=>val.includes(k.toLowerCase()));
  const isMean=meanKeys.some(k=>val.includes(k));
  const fb=document.getElementById('fb');

  // 처음 시도이고 바로 뜻을 맞춘 경우 → 카운터 없이 바로 통과
  if(!learnWrong && isMean && wordWriteCount===0 && meanWriteCount===0){
    answered=true;
    inp.disabled=true;inp.style.opacity='0.5';
    document.getElementById('nxt').style.display='block';
    fb.textContent='✓ 정답! (엔터로 다음)';
    fb.className='feedback ok';
    const ghost=document.getElementById('ghost-focus');
    if(ghost){ghost.focus();}
    return;
  }

  if(!isWord&&!isMean){
    // 틀렸을 때 → 카운터 모드 진입
    learnWrong=true;
    const counter=document.getElementById('write-counter');
    if(counter) counter.style.display='block';
    fb.textContent='✗ 틀렸어요! 단어와 뜻을 각 3번씩 써보세요';
    fb.className='feedback no';
    inp.value='';
    inp.focus();
    return;
  }

  // 카운터 모드 (틀린 적 있는 경우)
  if(learnWrong){
    const counter=document.getElementById('write-counter');
    if(counter) counter.style.display='block';
    if(isWord&&wordWriteCount<3) wordWriteCount++;
    if(isMean&&meanWriteCount<3) meanWriteCount++;
    updateWriteGuide();
    inp.value='';
    if(wordWriteCount>=3&&meanWriteCount>=3){
      answered=true;
      inp.disabled=true;inp.style.opacity='0.5';
      document.getElementById('nxt').style.display='block';
      fb.textContent='✓ 완료! 단어와 뜻을 모두 3번 썼어요 (엔터로 다음)';
      fb.className='feedback ok';
      const ghost=document.getElementById('ghost-focus');
      if(ghost){ghost.focus();}
    } else {
      const remaining=[];
      if(wordWriteCount<3) remaining.push('단어 '+(3-wordWriteCount)+'번');
      if(meanWriteCount<3) remaining.push('뜻 '+(3-meanWriteCount)+'번');
      fb.textContent='아직 '+remaining.join(', ')+' 더 써야 해요';
      fb.className='feedback ok';
      inp.focus();
    }
    return;
  }

  // 처음인데 뜻 맞춤 (위에서 처리) - 혹시 단어만 맞춘 경우
  answered=true;
  inp.disabled=true;inp.style.opacity='0.5';
  document.getElementById('nxt').style.display='block';
  fb.textContent='✓ 정답! (엔터로 다음)';
  fb.className='feedback ok';
  const ghost=document.getElementById('ghost-focus');
  if(ghost){ghost.focus();}
}

  tab='test';
  idx=0;score=0;wrong=[];answered=false;reviewMode=false;
  testFromLearn=true;

    document.getElementById('t-'+x).className='tab'+(x==='test'?' on':'');

// ── TEST ──
function renderTest(a){
  const list=reviewMode?reviewWords:(testFromLearn?learnedWords:words);
  if(!list.length){a.innerHTML='<p style="text-align:center;color:var(--muted);font-size:13px;padding:40px 0;">단어가 없습니다.</p>';return;}
  if(idx>=list.length){
    const totalWords=profileWords().length;
    const hasNextChunk=testFromLearn&&(chunkStart+CHUNK<totalWords);
    if(!reviewMode&&wrong.length>0&&!hasNextChunk){
      // 틀린 단어 있고 다음 구간 없을 때만 복습 화면
      a.innerHTML=`<div class="fade-in" style="padding-top:12px;">
        <div class="score-big">${score}/${list.length}</div>
        <div class="score-sub">틀린 단어 ${wrong.length}개</div>
        <div class="wl-list" style="margin-bottom:16px;">
          ${wrong.map(w=>`<div class="wl-item"><span class="wl-en">${w.w}</span><span class="wl-kr">${w.m}</span></div>`).join('')}
        </div>
        <button class="btn-g" id="btn-review">복습 시작 →</button>
        <button class="btn-d" id="btn-retest2">처음부터</button>
      </div>`;
      document.getElementById('btn-review').addEventListener('click',startReview);
      document.getElementById('btn-retest2').addEventListener('click',()=>{idx=0;score=0;wrong=[];answered=false;reviewMode=false;renderTest(document.getElementById('area'));});
    } else {
      a.innerHTML=`<div class="fade-in" style="padding-top:20px;">
        <div class="score-big">${score}/${list.length}</div>
        <div class="score-sub">${reviewMode?'복습 완료!':'테스트 완료!'} ${score===list.length?'— 완벽해요!':''}</div>
        ${hasNextChunk?`<button class="btn-g" id="btn-next-learn">다음 ${Math.min(CHUNK,totalWords-(chunkStart+CHUNK))}단어 학습하기 →</button>`:''}
        ${!reviewMode&&wrong.length>0?`<button class="btn-g" id="btn-review2">틀린 단어 복습 →</button>`:''}
        <button class="btn-d" id="btn-retest">다시 테스트</button>
        <button class="btn-d" id="btn-back-test">구간 선택으로</button>
        <button class="btn-d" id="btn-go-learn">학습 모드로</button>
      </div>`;
      const btnNext=document.getElementById('btn-next-learn');
      if(btnNext)btnNext.addEventListener('click',()=>{
        chunkStart+=CHUNK;
        idx=0;score=0;wrong=[];answered=false;testFromLearn=false;
        words=profileWords();
        tab='learn';
        ['learn','test','manage'].forEach(x=>{
          document.getElementById('t-'+x).className='tab'+(x==='learn'?' on':'');
        });
        renderLearn(document.getElementById('area'));
      });
      const btnReview2=document.getElementById('btn-review2');
      if(btnReview2)btnReview2.addEventListener('click',startReview);
      document.getElementById('btn-retest').addEventListener('click',()=>{idx=0;score=0;wrong=[];answered=false;reviewMode=false;renderTest(document.getElementById('area'));});
      document.getElementById('btn-go-learn').addEventListener('click',()=>{testFromLearn=false;words=profileWords();goTab('learn');});
      const btnBackTest=document.getElementById('btn-back-test');
      if(btnBackTest)btnBackTest.addEventListener('click',()=>{testFromLearn=false;showTestChunkSelect();});
    }
    return;
  }
  const w=list[idx];
  const pct=Math.round(idx/list.length*100);
  a.innerHTML=`<div class="fade-in">
    <div class="prog-wrap">
      <div class="prog-meta"><span>${idx+1} / ${list.length} · 정답 ${score}</span><span>${pct}%</span></div>
      <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="wcard">
      <div class="badge">테스트 모드</div>
      <div class="eng">${w.w}</div>
      <div id="rv-m" class="kor" style="display:none;">${w.m}</div>
      ${w.d?`<div id="rv-d" class="desc" style="display:none;">${w.d}</div>`:''}
      ${w.ex?`<div id="rv-e" class="ex" style="display:none;margin-top:10px;">${w.ex}</div>`:''}
    </div>
    <div class="ans-wrap">
      <div class="ans-row">
        <input type="text" id="ans" placeholder="한국어 뜻을 입력하세요" autocomplete="off" autocorrect="off" spellcheck="false" onkeydown="handleTestKey(event)">
        <button onclick="checkAns()">확인</button>
      </div>
      <div class="feedback" id="fb"></div>
    </div>
    <button class="btn-g" id="nxt" style="display:none;">다음 단어 →</button>
  </div>`;
  setTimeout(()=>{const el=document.getElementById('ans');if(el)el.focus();},100);
  const nxtBtn=document.getElementById('nxt');
  if(nxtBtn)nxtBtn.addEventListener('click',()=>{idx++;answered=false;renderTest(document.getElementById('area'));});
}
function checkAns(){
  if(answered)return;
  const inp=document.getElementById('ans');
  if(!inp||!inp.value.trim())return;
  const list=reviewMode?reviewWords:(testFromLearn?learnedWords:words);
  const w=list[idx];
  const val=inp.value.trim();
  const keys=w.m.replace(/[~·\/\(\)\[\]]/g,' ').split(/[\s,;]+/).filter(k=>k.length>1);
  const hit=keys.some(k=>val.includes(k));
  answered=true;inp.disabled=true;inp.style.opacity='0.5';
  ['rv-m','rv-d','rv-e'].forEach(id=>{const el=document.getElementById(id);if(el)el.style.display='block';});
  document.getElementById('nxt').style.display='block';
  if(hit){score++;document.getElementById('fb').textContent='✓ 정답! (엔터로 다음)';document.getElementById('fb').className='feedback ok';}
  else{if(!reviewMode)wrong.push(w);document.getElementById('fb').textContent='✗ 오답 — '+w.m+' (엔터로 다음)';document.getElementById('fb').className='feedback no';}
  const ghost=document.getElementById('ghost-focus');
  if(ghost){ghost.focus();}
}
function startReview(){reviewMode=true;reviewWords=[...wrong].sort(()=>Math.random()-.5);idx=0;score=0;answered=false;render();}

// ── MANAGE ──
function renderManage(a){
  if(scanState==='scanning'){
    a.innerHTML=`<div class="scanning-box fade-in"><div class="dot-row"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div><p class="scan-sub">AI가 이미지에서 단어를 스캔하는 중...</p></div>`;return;
  }
  if(scanState==='preview'){
    a.innerHTML=`<div class="fade-in">
      <div class="section-label">스캔 결과 — ${scannedWords.length}개 발견</div>
      <div class="wl-list" style="margin-bottom:12px;">
        ${scannedWords.map((w,i)=>`<div class="preview-item"><span class="preview-en">${w.w}</span><span class="preview-kr">${w.m}</span><span style="color:var(--hint);font-size:18px;cursor:pointer;" id="sdel-${i}">×</span></div>`).join('')}
      </div>
      <button class="btn-g" id="btn-add-scanned">목록에 추가 (${scannedWords.length}개) →</button>
      <button class="btn-d" onclick="scanState='idle';render()">취소</button>
    </div>`;
    scannedWords.forEach((_,i)=>{
      const el=document.getElementById('sdel-'+i);
      if(el)el.addEventListener('click',()=>{scannedWords.splice(i,1);renderManage(document.getElementById('area'));});
    });
    const btnAdd=document.getElementById('btn-add-scanned');
    if(btnAdd)btnAdd.addEventListener('click',addScanned);
    return;
  }
  const p=currentProfile();
  const weekName=p&&p.weeks?p.weeks[currentWeekIdx].name:'';
  const banner=showBanner?`<div class="install-banner">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1D9E75" stroke-width="2" style="flex-shrink:0"><path d="M12 2L12 16M8 12l4 4 4-4"/><rect x="3" y="18" width="18" height="3" rx="1"/></svg>
    <p><b>홈화면에 추가</b><br>Safari → 공유 → '홈 화면에 추가'</p>
    <span class="install-close" id="banner-close">×</span>
  </div>`:'';

  a.innerHTML=`<div class="fade-in">
    ${banner}
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
      <span style="font-size:15px;font-weight:500;color:var(--text);">${weekName}</span>
      <button id="btn-rename-week" style="font-size:11px;padding:4px 10px;border-radius:8px;border:0.5px solid var(--border);background:var(--bg2);color:var(--muted);cursor:pointer;">이름 변경</button>
    </div>
    <div class="stat-grid">
      <div class="stat-box"><div class="stat-n">${words.length}</div><div class="stat-l">전체 단어</div></div>
      <div class="stat-box"><div class="stat-n">${wrong.length}</div><div class="stat-l">틀린 단어</div></div>
    </div>
    <div class="section-label" style="margin-top:14px;">이미지 / PDF 스캔</div>
    <div class="upload-zone" id="upload-zone">
      <input type="file" id="file-in" accept="image/*,application/pdf" multiple>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#5DCAA5" stroke-width="1.5" style="display:block;margin:0 auto 8px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <p>탭해서 <b>이미지 또는 PDF</b> 업로드<br><span style="font-size:11px;">최대 5개 동시 선택 · AI 자동 인식</span></p>
    </div>
    <div class="section-label" style="margin-top:14px;">단어 직접 추가</div>
    <div class="add-row" style="margin-bottom:4px;">
      <input type="text" id="new-en" placeholder="영어 단어">
      <input type="text" id="new-kr" placeholder="한국어 뜻">
      <button id="btn-add-manual">추가</button>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:14px;margin-bottom:8px;">
      <span style="font-size:10px;font-family:'Space Mono',monospace;letter-spacing:.08em;color:var(--hint);text-transform:uppercase;">단어 목록 (${words.length}개)</span>
      <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;">
        <button id="btn-selall" style="font-size:11px;padding:4px 10px;border-radius:8px;border:0.5px solid var(--border);background:var(--bg2);color:var(--muted);cursor:pointer;">모두 선택</button>
        <button id="btn-test-sel" style="font-size:11px;padding:4px 10px;border-radius:8px;border:0.5px solid var(--green);background:var(--green-dim);color:var(--green-light);cursor:pointer;display:none;">선택 시험 보기</button>
        <button id="btn-delsel" style="font-size:11px;padding:4px 10px;border-radius:8px;border:0.5px solid #D85A30;background:var(--coral-dim);color:#D85A30;cursor:pointer;display:none;">선택 삭제</button>
      </div>
    </div>
    <div class="wl-list" id="wl-list">
      ${words.map((w,i)=>`
        <div class="wl-item" id="wl-${i}">
          <span id="chk-${i}" style="width:16px;height:16px;border-radius:4px;border:0.5px solid var(--border);background:var(--bg3);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10px;color:var(--green-light);margin-right:2px;"></span>
          <span class="wl-en">${w.w}</span>
          <span class="wl-kr">${w.m}</span>
          <span id="del-${i}" style="color:var(--hint);font-size:18px;cursor:pointer;padding:0 4px;line-height:1;">×</span>
        </div>`).join('')}
    </div>

  </div>`;
  bindManageEvents();
}

function bindManageEvents(){
  const bannerClose=document.getElementById('banner-close');
  if(bannerClose)bannerClose.addEventListener('click',()=>{showBanner=false;renderManage(document.getElementById('area'));});
  const btnRename=document.getElementById('btn-rename-week');
  if(btnRename)btnRename.addEventListener('click',()=>{
    const p=currentProfile();if(!p||!p.weeks)return;
    const cur=p.weeks[currentWeekIdx].name;
    const newName=prompt('주차 이름 변경',cur);
    if(newName&&newName.trim()){
      p.weeks[currentWeekIdx].name=newName.trim();
      saveProfiles();renderWeekTabs();renderManage(document.getElementById('area'));
    }
  });
  const uploadZone=document.getElementById('upload-zone');
  const fileIn=document.getElementById('file-in');
  if(uploadZone&&fileIn){
    uploadZone.addEventListener('click',()=>fileIn.click());
    fileIn.addEventListener('change',handleFile);
  }
  const btnAddManual=document.getElementById('btn-add-manual');
  if(btnAddManual)btnAddManual.addEventListener('click',addManual);
  const btnSelAll=document.getElementById('btn-selall');
  if(btnSelAll)btnSelAll.addEventListener('click',toggleSelectAll);
  const btnDelSel=document.getElementById('btn-delsel');
  if(btnDelSel)btnDelSel.addEventListener('click',delSelected);
  const btnTestSel=document.getElementById('btn-test-sel');
  if(btnTestSel)btnTestSel.addEventListener('click',startSelectedTest);

  words.forEach((_,i)=>{
    const row=document.getElementById('wl-'+i);
    const delBtn=document.getElementById('del-'+i);
    if(row)row.addEventListener('click',()=>toggleSelect(i));
    if(delBtn)delBtn.addEventListener('click',(e)=>{e.stopPropagation();delWord(i);});
  });
  applySelectVisual();
}

function toggleSelect(i){
  const pos=selected.indexOf(i);
  if(pos>=0)selected.splice(pos,1);else selected.push(i);
  applySelectVisual();
}
function toggleSelectAll(){
  selected=selected.length===words.length?[]:words.map((_,i)=>i);
  applySelectVisual();
}
function applySelectVisual(){
  words.forEach((_,i)=>{
    const on=selected.indexOf(i)>=0;
    const chk=document.getElementById('chk-'+i);
    const row=document.getElementById('wl-'+i);
    if(chk){chk.textContent=on?'✓':'';chk.style.background=on?'rgba(29,158,117,0.2)':'var(--bg3)';chk.style.borderColor=on?'#1D9E75':'var(--border)';}
    if(row)row.style.background=on?'rgba(29,158,117,0.08)':'';
  });
  const btn=document.getElementById('btn-delsel');
  const btnTest=document.getElementById('btn-test-sel');
  const btnAll=document.getElementById('btn-selall');
  if(btn){btn.style.display=selected.length>0?'block':'none';btn.textContent='선택 삭제 ('+selected.length+')';}
  if(btnTest){btnTest.style.display=selected.length>0?'block':'none';btnTest.textContent='시험 보기 ('+selected.length+'개)';}
  if(btnAll)btnAll.textContent=selected.length===words.length?'모두 해제':'모두 선택';
}
function startSelectedTest(){
  if(!selected.length)return;
  const selWords=selected.map(i=>words[i]);
  learnedWords=[...selWords].sort(()=>Math.random()-.5);
  testFromLearn=true;
  tab='test';
  idx=0;score=0;wrong=[];answered=false;reviewMode=false;
  selected=[];
  ['learn','test','manage'].forEach(x=>{
    document.getElementById('t-'+x).className='tab'+(x==='test'?' on':'');
  });
  renderTest(document.getElementById('area'));
}
function delSelected(){
  if(!selected.length)return;
  const sorted=[...selected].sort((a,b)=>b-a);
  sorted.forEach(i=>words.splice(i,1));
  selected=[];
  setProfileWords(words);updateCount();
  renderManage(document.getElementById('area'));
}
function delWord(i){
  words.splice(i,1);selected=[];
  setProfileWords(words);updateCount();
  renderManage(document.getElementById('area'));
}
function addManual(){
  const en=document.getElementById('new-en').value.trim();
  const kr=document.getElementById('new-kr').value.trim();
  if(!en||!kr)return;
  words.push({w:en,m:kr,d:'',ex:''});
  setProfileWords(words);updateCount();
  document.getElementById('new-en').value='';
  document.getElementById('new-kr').value='';
  renderManage(document.getElementById('area'));
}
function addScanned(){
  const fresh=scannedWords.filter(s=>!words.some(w=>w.w.toLowerCase()===s.w.toLowerCase()));
  words.push(...fresh);
  const dupes=scannedWords.length-fresh.length;
  scanState='idle';scannedWords=[];
  setProfileWords(words);updateCount();render();
  if(dupes>0)setTimeout(()=>alert(fresh.length+'개 추가! (중복 '+dupes+'개 제외)'),200);
}

async function fileToBase64(file){
  if(file.type==='application/pdf'){
    const ab=await file.arrayBuffer();
    const bytes=new Uint8Array(ab);let bin='';
    bytes.forEach(b=>bin+=String.fromCharCode(b));
    return{base64:btoa(bin),mediaType:'application/pdf',isPdf:true};
  }
  const base64=await new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result.split(',')[1]);
    r.onerror=rej;
    r.readAsDataURL(file);
  });
  return{base64,mediaType:file.type||'image/jpeg',isPdf:false};
}

async function scanOneFile(file){
  const{base64,mediaType,isPdf}=await fileToBase64(file);
  const block=isPdf
    ?{type:'document',source:{type:'base64',media_type:'application/pdf',data:base64}}
    :{type:'image',source:{type:'base64',media_type:mediaType,data:base64}};
  const PROXY='https://toeic-proxy.dlrkdwns96.workers.dev';
  const resp=await fetch(PROXY,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      model:'claude-sonnet-4-20250514',
      max_tokens:4096,
      messages:[{role:'user',content:[
        block,
        {type:'text',text:'이 이미지에서 영어 단어와 한국어 뜻 쌍만 추출하세요. 반드시 JSON 배열만 출력하고 다른 텍스트는 절대 포함하지 마세요. 형식: [{"w":"영어단어","m":"한국어뜻"},...] 버튼, UI 텍스트, 제목은 제외하고 단어와 뜻만 추출하세요.'}
      ]}]
    })
  });
  if(!resp.ok){
    const errText=await resp.text().catch(()=>'');
    throw new Error('HTTP '+resp.status+': '+errText.slice(0,100));
  }
  const data=await resp.json();
  console.log('API response:', JSON.stringify(data).slice(0,300));
  if(data.error)throw new Error(data.error.message||'API error');
  if(!data.content||!data.content.length)throw new Error('빈 응답: '+JSON.stringify(data).slice(0,100));
  const text=data.content.filter(c=>c.type==='text').map(c=>c.text).join('');
  console.log('Raw text:', text.slice(0,200));
  const clean=text.replace(/^[\s\S]*?(?=\[)/,'').replace(/\][\s\S]*$/,']').trim();
  console.log('Clean JSON:', clean.slice(0,200));
  if(!clean.startsWith('['))throw new Error('JSON 형식 아님: '+text.slice(0,80));
  const parsed=JSON.parse(clean);
  if(!Array.isArray(parsed))throw new Error('배열 아님');
  return parsed.filter(x=>x.w&&x.m);
}

async function handleFile(e){
  const files=Array.from(e.target.files).slice(0,5);
  if(!files.length)return;
  scanState='scanning';
  document.getElementById('area').innerHTML=`
    <div class="scanning-box fade-in">
      <div class="dot-row"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      <p class="scan-sub" id="scan-status">파일 스캔 중... (0/${files.length})</p>
    </div>`;
  const allWords=[];
  let done=0;
  for(const file of files){
    try{
      const result=await scanOneFile(file);
      allWords.push(...result);
      done++;
      const st=document.getElementById('scan-status');
      if(st)st.textContent='파일 스캔 중... ('+done+'/'+files.length+')';
    }catch(err){
      done++;
      console.error('스캔 실패 ('+file.name+'):', err);
      const st=document.getElementById('scan-status');
      if(st)st.textContent='일부 실패('+file.name+'): '+err.message+' ('+done+'/'+files.length+')';
    }
  }
  e.target.value='';
  if(!allWords.length){
    scanState='idle';render();
    setTimeout(()=>alert('단어를 찾지 못했어요.\n이미지가 선명한지 확인 후 다시 시도해주세요.'),100);
    return;
  }
  // 중복 제거
  const seen=new Set();
  scannedWords=allWords.filter(x=>{
    const key=x.w.toLowerCase();
    if(seen.has(key))return false;
    seen.add(key);return true;
  });
  scanState='preview';render();
}

if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
loadProfiles();
renderProfileScreen();
</script>
